# helm/octogee-gateway/values.yaml — defaults for ONE gateway instance.
#
# The fleet controller (glm-controller) installs this chart once per gateway instance
# under release name `octogee-gw-<gatewayId>`. The umbrella `octogee`
# release no longer manages gateway pods.

# Logical, stable, controller-set gateway identity — a bare name (`shared-a`,
# `walter`, `canary`). Written to Firestore `gateways/{gatewayId}`
# heartbeats and matched against user `provisioning.openclaw.gatewayId`.
# Also forms the per-instance K8s resource names
# (`octogee-gateway-<gatewayId>`, `gateway-edge-<gatewayId>`) that the shared
# gateway-router forwards public `/g/<id>/*` requests to. Must be a lowercase
# DNS-safe id that fits every rendered suffix.
gatewayId: ""

# Disposable revision instance id ({gatewayId}-r{n}). The fleet controller sets it per
# revision Helm release; every per-instance K8s resource NAME and the
# `gateway-instance` selector derive from it so two simultaneous revisions of
# one gateway never collide. Empty → defaults to gatewayId (legacy single-
# revision renders are unchanged). Tenant identity (KSA, secrets, GATEWAY_ID)
# stays gateway-scoped on gatewayId, never revisionId.
revisionId: ""

# Where this render runs: "cluster" for a Kubernetes Deployment, "gce-vm" when
# the fleet controller renders a gateway VM's runtime bundle from this chart.
runtimeKind: cluster

# Bundle SHA. All three sidecars (gateway, gateway-edge, chat-proxy)
# default to this tag for atomic rolls. Per-image overrides below take
# precedence when set, but the operator workflow is single-SHA.
imageTag: "latest"

# Lets OpenClaw main-branch preview images (tags containing "-main.") run
# destructive actions against state written by a build with a different
# hash. Only an environment that ships main previews opts in.
allowOlderOpenclawMainBuilds: false

image:
  repository: ""
  # Inherits from .Values.imageTag when empty. Override only for an
  # emergency hotfix.
  tag: ""

serviceAccountName: ""
serviceAccount:
  create: false
  annotations: {}

builderAccess:
  # Locked by default. The fleet controller may enable this only after a user has a
  # tenant-owned disposable isolated runtime and the app/user mirror has been
  # updated.
  controlUiEnabled: false
  # How Control UI sessions identify to OpenClaw. "shared-operator" keeps the
  # pod token and one operator profile; "per-user" switches the gateway to
  # trusted-proxy auth so every Octogee user carries their own identity and
  # role. Isolated class only; ignored on shared gateways.
  controlIdentity: shared-operator
  # Isolated gateway TokenReview path. Internal gateway identity checks
  # call the Kubernetes API server; the fleet-wide gateway-egress policy blocks
  # RFC1918, so GKE Dataplane V2 needs the real API-server endpoint /32 CIDR(s)
  # from the default/kubernetes EndpointSlice, not the Service ClusterIP.
  # Default off; set per isolated gateway only.
  kubeApiServerEgressCidrs: []

# Replica count — the fleet controller passes `--set replicas=0` for desiredStatus=paused and
# `--set replicas=1` for a running or draining member.
replicas: 1

# Roll strategy — "recreate" (default) or "surge" (RollingUpdate maxSurge=1 /
# maxUnavailable=0: new pod Ready before the old one dies). The fleet controller passes
# surge for managed releases so unpublished files transfer before source removal.
rollStrategy: recreate

# One gateway pod per node: "required" refuses to schedule a second gateway on a
# node; "preferred" spreads gateways when nodes allow and otherwise shares one,
# for a single-node local cluster.
podAntiAffinity: required

nodeSelector: {}
computeClass: ""
# Sandbox runtime for the gateway pod. Empty runs it on the node's default runtime,
# for a local cluster without gVisor.
runtimeClassName: gvisor
computerDesktop: auto

# Pod-termination durable-flush budget. Kubernetes runs this hook before SIGTERM and
# counts it against terminationGracePeriodSeconds, so keep timeoutSeconds below
# gracePeriodSeconds to leave the entrypoint time to forward TERM to children.
preStopFlush:
  enabled: true
  terminationGracePeriodSeconds: 30
  timeoutSeconds: 10

# Gateway class. Empty means the shared gateway. `isolated` is the
# owner-bound isolated gateway class.
gatewayClass: ""

# Installed image/tooling profile. Empty derives from gatewayClass:
# shared => standard, isolated => isolated.
imageProfile: ""

# Legacy overloaded capability/image profile. Keep for existing desired-state
# docs and clients; new callers should set gatewayClass + imageProfile.
profile: ""

# Gateway container security defaults stay locked down. Personal build
# gateways may override this per instance via glmGateways desired state.
gatewayContainerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Chart fingerprint — the fleet controller passes its SHA-256 of the chart bytes via
# `--set chartFingerprint=...` so subsequent reconciles can detect chart
# template drift even when image-tag is unchanged. Stored on the helm
# release; never authored by humans. The release default is empty
# because manual `helm upgrade` from operator machines should be
# allowed even when no fingerprint is computed.
#
# Metadata-only: no template renders this value. It exists solely as a
# stored helm value that `helm get values -o json` can read back during
# reconcile. The fingerprint covers the whole chart dir including
# values.test.yaml AND values.prod.yaml, so editing the test values
# triggers a one-tick re-apply in PROD even though PROD's render is
# unchanged — free no-op rolls, not a correctness issue.
chartFingerprint: ""
deploymentIntentFingerprint: ""

env:
  gcloudProject: ""
  firebaseProjectId: ""
  agentPrefix: "octogee-"
  githubOrg: "octogee"
  mmUrl: ""  # auto-computed from release namespace if empty
  octogeeApiUrl: ""  # internal octogee-api DNS; auto-computed from release namespace if empty
  mmSiteUrl: ""
  mmInteractionsCallbackBaseUrl: ""  # auto-computed per-instance if empty
  mmInteractionsAllowedSourceIps: "127.0.0.1"
  mmReplyToMode: "off"
  mmStreamingMode: "partial"
  apiPublicUrl: "https://api.example.com"
  # Comma-separated list of allowed Origin headers on the chat-proxy
  # browser→OpenClaw WebSocket upgrade. Empty = chat-proxy falls back to
  # localhost-only (dev mode). Populate per-env in values.{prod,test}.yaml.
  allowedWsOrigins: ""
  discordOpsWebhookUrl: ""
  gitApiUrl: ""
  gitSshHost: ""
  llmBrokerUrl: ""  # auto-computed from release namespace for isolated-class gateways
  openaiEmbeddingsEnabled: "true"
  platformVertexEnabled: "false"
  platformMetaEnabled: "false"
  openaiEmbeddingsModel: "text-embedding-3-small"
  openclawLogLevel: "info"
  logLevel: "info"
  logKeepLongIdentifiers: false
  rpcTraceVerbose: false
  fleetControllerPort: "3003"
  migrationRsyncPort: "30873"
  builderNpmFallbackRegistry: "https://registry.npmjs.org/"

# Gateway storage is emptyDir for every class. Shared gateways use stable
# identities and on-demand capacity; disposable isolated gateways are Spot-first with
# on-demand fallback. Durable product state rehydrates from the substrate.

# Per-pod sizing tier. Operator-facing enum that maps to the matching
# .Values.tiers entry below — drives resources + node-runtime tuning
# together. The fleet controller passes `--set sizingTier=<tier>` per gateway; when
# empty the chart falls back to .Values.classDefaults[gatewayClass],
# then legacy .Values.profileDefaults[imageProfile].
sizingTier: ""

# Class → default tier mapping. Used when sizingTier is unset.
classDefaults:
  shared: "m"
  isolated: "s"

# Legacy image-profile → default tier mapping. Used when classDefaults is
# absent on old releases.
profileDefaults:
  standard: "l"
  isolated: "s"

# Tier presets — the canonical sizing matrix, capped at 4 vCPU so every tier
# fits Autopilot's general-purpose envelope (30 vCPU / 110 GiB / 10 GiB
# ephemeral per pod, 1:1–1:6.5 vCPU:GiB). Autopilot rewrites an
# ephemeral-storage limit that differs from its request, so request == limit
# here. Mirrored in shared/types/sizing.ts (TS SSOT for cost-estimator +
# admin API); tests/specs/helm-octogee-gateway-sizing.spec.ts asserts the two
# stay in lockstep. Edit both sides together.
tiers:
  xs:
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
        ephemeral-storage: "4Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
        ephemeral-storage: "4Gi"
    nodejs:
      uvThreadpoolSize: "4"
      maxOldSpaceSizeMb: "1536"
  s:
    resources:
      requests:
        cpu: "2000m"
        memory: "8Gi"
        ephemeral-storage: "4Gi"
      limits:
        cpu: "2000m"
        memory: "8Gi"
        ephemeral-storage: "4Gi"
    nodejs:
      uvThreadpoolSize: "4"
      maxOldSpaceSizeMb: "3072"
  m:
    resources:
      requests:
        cpu: "2000m"
        memory: "8Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "2000m"
        memory: "8Gi"
        ephemeral-storage: "5Gi"
    nodejs:
      uvThreadpoolSize: "4"
      maxOldSpaceSizeMb: "5632"
  l:
    resources:
      requests:
        cpu: "4000m"
        memory: "16Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "4000m"
        memory: "16Gi"
        ephemeral-storage: "5Gi"
    nodejs:
      uvThreadpoolSize: "6"
      maxOldSpaceSizeMb: "10240"

probes:
  # Non-shared startup reaches the fleet controller only after durable-config
  # restore and repair. 10s × 60 gives each identity-pure attempt 10 minutes;
  # an attempt that exceeds the budget restarts from gateway identity.
  startup:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 60
    sharedFailureThreshold: 90
    timeoutSeconds: 10
  # Non-shared liveness rides the same runner plane — a dead fleet controller
  # restarts the pod; an OpenClaw failure only drops readiness (repair stays
  # reachable). Shared gateways probe OpenClaw directly.
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 60
    failureThreshold: 5
    timeoutSeconds: 10
  # Readiness is the fleet-controller surge gate. On XS, a short steady-state
  # budget catches loss of OpenClaw, broker-profile convergence, or the
  # Dashboard bridge without turning ordinary cold-start work into restarts.
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 3
    successThreshold: 1

pdb:
  enabled: true
  minAvailable: 1


# ── gateway-edge sidecar ──────────────────────────────────────────────────
gatewayEdge:
  enabled: true
  image:
    repository: ""
    tag: ""  # inherits from imageTag
  port: 3001
  probes:
    startup:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 60
      timeoutSeconds: 2
    readiness:
      initialDelaySeconds: 0
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 0
      periodSeconds: 30
  env:
    GITEA_URL: ""  # auto-computed from K8S_NAMESPACE
    GITEA_ORG: "octogee"
    MM_URL: ""  # auto-computed from K8S_NAMESPACE
    FIREBASE_PROJECT_ID: ""
    GCLOUD_PROJECT: ""
    GCP_PROJECT_ID: ""
    APP_URL: "https://app.example.com"
    API_PUBLIC_URL: "https://api.example.com"
    SITE_URL: "https://example.com"
    # Credential-at-rest KMS key (terraform/modules/kms output
    # `kms_creds_key_name`). Set per environment via values.{prod,
    # test}.yaml — gateway-edge fails loud at first integrations write
    # if missing (no silent plaintext fallback). See
    # gateway-edge/src/lib/kms.ts.
    OCTOGEE_KMS_KEY_NAME: ""
  # Platform secrets (GITEA_TOKEN, MM_ADMIN_TOKEN, INTERNAL_SERVICE_KEY,
  # OAuth, Discord, email and billing keys, INVITE_SECRET, …) are intentionally NOT mounted on
  # the gateway-edge sidecar or the OpenClaw gateway pod — the agent runs
  # arbitrary code there, so platform credentials must stay off it. Nothing rendered
  # this list anyway (the deployment injects only gatewayEdge.env); the cluster
  # gateway-edge and the platform broker sidecar hold what's needed. See
  # credential-brokering #1480 / #1478 / #1493 / #1494. Do NOT add a
  # `range .Values.gatewayEdge.secrets` env loop here — it re-introduces the exact
  # exposure those PRs removed. (Dead block + unused requireGatewayEdgeSecret helper
  # removed 2026-06-15.)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Disable per gateway if a cluster doesn't support NetworkPolicy enforcement.
networkPolicy:
  enabled: true
