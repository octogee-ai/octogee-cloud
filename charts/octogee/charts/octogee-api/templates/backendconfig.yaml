{{- if eq ((.Values.global).ingressClassName | default "traefik") "gce" }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.backendConfig.name | default "octogee-api-backend" }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.backendConfig.cloudArmor.enabled }}
  securityPolicy:
    name: {{ .Values.backendConfig.cloudArmor.policyName }}
  {{- end }}
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.backendConfig.healthCheck.path | default "/health" }}
    port: {{ .Values.backendConfig.healthCheck.port | default .Values.port }}
  timeoutSec: {{ .Values.backendConfig.timeoutSec | default 30 }}
  connectionDraining:
    drainingTimeoutSec: {{ .Values.backendConfig.drainingTimeoutSec | default 300 }}
{{- end }}
