image:
  repository: ghcr.io/octogee-ai/octogee-cloud/glm-controller
  tag: ""
  digest: ""

# Workload Identity binding — KSA `glm-controller` impersonates THIS GSA:
# The fleet controller's own dedicated identity (octogee-glm-controller), which carries the
# privileged teardown grants. Per-env values.yaml overrides with the
# env-suffixed GSA.
gcpServiceAccount: ""

# The gateway-POD consumer GSA (octogee-gateway) that new per-gateway
# auth-token Secret Manager secrets are bound to when an admin adds a gateway.
# Distinct from gcpServiceAccount above — the fleet controller's identity must NOT be granted
# access to gateway token secrets. Per-env values.yaml sets the env-suffixed GSA.
gatewayServiceAccount: ""

# GKE Workload Identity pool project. Test and prod share the octogee GKE
# cluster, so TEST must still emit serviceAccount:octogee.svc.id.goog[...] IAM
# members even though its runtime Google project is the TEST project.
workloadIdentityProject: ""

kmsKeyName: ""

# Path inside the controller image where the standalone per-instance
# gateway chart is baked at build time (see fleet-controller/Dockerfile,
# which COPYs charts/octogee-gateway → /charts/octogee-gateway). The
# reconciler installs `octogee-gw-<gatewayId>` releases off this
# chart. Override only for tests / non-standard image layouts.
gatewayChart: /charts/octogee-gateway

# A deployment target registry for an installation outside the bundled
# targets, in the shape of core/src/deployment-targets.json. Empty uses the
# bundled registry.
deploymentTargets: {}

# Values for every gateway release, used instead of the target's
# gatewayValuesFile inside the baked chart. Empty uses that file.
gatewayValues: {}

# Shared pool bounds. The fleet controller mints `shared-N` slots on demand between these,
# from the platform release image below. Per-environment values set the floor:
# TEST 1 (0 allowed), PROD 2.
sharedPool:
  minReplicas: 1
  maxReplicas: 8

# The gateway and gateway-edge images every shared slot converges to. The
# platform release (Deploy platform) sets the digest-qualified tags from the
# deployed build's immutable manifest; the fleet controller rolls each slot with surge.
# The isolated gateway image is octogee-gateway-builder beside gatewayImageRepository.
platformRelease:
  sourceSha: ""
  gatewayImageRepository: ghcr.io/octogee-ai/octogee-cloud/octogee-gateway
  gatewayImageTag: ""
  # Same build's octogee-gateway-builder digest; disposable isolated gateways allocated
  # from a shared slot inherit the slot's release payload and need it.
  builderImageTag: ""
  gatewayEdgeImageRepository: ghcr.io/octogee-ai/octogee-cloud/gateway-edge
  gatewayEdgeImageTag: ""
  openclawSourceSha: ""

# User-cleanup target endpoints (Gitea + Mattermost). Defaults
# resolve to in-cluster ClusterIP Services for the same Helm release;
# operator can override per-env if cluster topology changes.
env:
  gitApiUrl: ""
  gitOrg: ""
  mmUrl: ""
  systemNotificationUrl: ""

# Google sign-in for the fleet command line. googleClientId is the OAuth client
# of type "TVs and Limited Input devices"; operatorEmails may use the Admin API.
fleetIdentity:
  googleClientId: ""
  operatorEmails: []
  # Secret whose public-key entry holds the Ed25519 operator public key. The
  # fleet command line signs short-lived tokens with the matching private key.
  operatorKeySecretName: ""

# Gitea gateway SSH key sweep: dry-run logs per-user managed-key counts,
# enforce deletes keys whose owning gateway pod or VM is gone.
# legacy governs legacy-titled keys separately: enforce deletes those whose key
# material no live gateway serving that user holds under its owner title.
giteaGatewayKeyGc:
  mode: enforce

posthog:
  host: ""
  projectId: ""
  personalApiKeySecretName: posthog-cloud
  personalApiKeySecretKey: personal_api_key

modelKeyIssuer:
  enabled: true
  issueUrl: ""
  revokeUrl: ""
  bearerSecretName: gateway-model-key-issuer
  bearerSecretKey: bearer_token
  timeoutMs: "10000"

# Ingress shells whose dynamic per-gateway paths are owned by the fleet controller.
# `sharedName` points all writers at the consolidated app Ingress; leave
# it empty for the legacy per-host Ingress names below.
ingress:
  sharedName: ""
  apiName: gateway-edge-ingress
  apiHost: ""
  previewName: preview-ingress
  previewHost: ""

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# The fleet controller HTTP — admin / fleet API surface served from the control
# plane. Mounts the same admin-fleet-router factory gateway-edge uses,
# so the admin Gateways tab keeps responding when no gateway pods are
# booted. The public API host's Ingress (in gateway-edge chart)
# routes specific fleet paths to this Service.
http:
  port: 8080

backendConfig:
  name: glm-controller-backend
  cloudArmor:
    enabled: false
    policyName: octogee-waf
  timeoutSec: 3600
  healthCheck:
    path: /healthz
    port: 8080

disposableGateway:
  idleMs: "900000"
  idleWarningMs: "300000"

computerParking:
  disposable: false
  stateContract: unverified
