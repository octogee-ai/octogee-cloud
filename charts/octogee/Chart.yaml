apiVersion: v2
name: octogee
description: Octogee platform umbrella chart — deploys the full stack
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: cloud-sql-proxy
    version: "0.1.0"
    repository: "file://charts/cloud-sql-proxy"
    condition: cloud-sql-proxy.enabled

  - name: mattermost
    version: "0.1.0"
    repository: "file://charts/mattermost"
    condition: mattermost.enabled

  - name: gitea
    version: "12.7.0"
    repository: "https://dl.gitea.com/charts/"

  - name: gateway-edge
    version: "0.1.0"
    repository: "file://charts/gateway-edge"

  # Cluster-singleton API service for non-locality routes lifted from
  # gateway-edge.
  - name: octogee-api
    version: "0.1.0"
    repository: "file://charts/octogee-api"

  # NOTE: the `gateway` sub-chart was removed in the controller-ownership
  # refactor. Per-instance gateway pods are now managed by glm-controller
  # via per-instance helm releases off charts/octogee-gateway/. Spanning
  # gateway-fleet resources (alias Service, NetworkPolicy, preview
  # Ingress) live in templates/gateway-fleet.yaml.

  - name: glm-controller
    version: "0.1.0"
    repository: "file://charts/glm-controller"
    condition: glm-controller.enabled
