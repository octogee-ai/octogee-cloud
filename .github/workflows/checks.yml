name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Select package checks
        id: packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
            matrix="$(node scripts/ci/check-packages.mjs "$RUNNER_TEMP/changed-paths")"
          else
            matrix="$(node scripts/ci/check-packages.mjs --full)"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix" | jq -r '"Package checks: " + ([.include[].name] | join(", "))' >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: moderate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          path: ${{ runner.temp }}/eslint-cache
          key: eslint-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', '**/eslint.config.*') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', '**/eslint.config.*') }}-
      - name: Lint
        run: npm run lint -- --cache --cache-strategy content --cache-location "$RUNNER_TEMP/eslint-cache"

  packages:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Use the gateway image's npm
        if: matrix.gateway-npm
        run: npm install --global "npm@$(sed -n 's/^ARG NPM_VERSION=//p' gateway/Dockerfile.base)" --no-audit --no-fund
      - name: Install Helm 4.3.1
        if: matrix.helm
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C /usr/local/bin --strip-components=1 linux-amd64/helm
          helm version --short
      - name: Install PostgreSQL 16 with pgvector 0.8.7
        if: matrix.postgres
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: $(dpkg --print-architecture)" 'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends postgresql-16 'postgresql-16-pgvector=0.8.7-*'
      - name: Install dependencies
        env:
          INSTALLS: ${{ matrix.installs }}
          BUILDS: ${{ matrix.builds }}
        run: |
          for directory in $INSTALLS; do
            npm ci --prefix "$directory" --no-audit --no-fund
            case " $BUILDS " in
              *" $directory "*) npm run build --prefix "$directory" ;;
            esac
          done
      - name: Typecheck and test
        env:
          PACKAGE_CHECK: ${{ matrix.name }}
        run: node scripts/ci/check-packages.mjs --run "$PACKAGE_CHECK"

  checks:
    name: checks
    if: always()
    needs: [plan, lint, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          LINT: ${{ needs.lint.result }}
          PACKAGES: ${{ needs.packages.result }}
        run: test "$PLAN" = success && test "$LINT" = success && test "$PACKAGES" = success
