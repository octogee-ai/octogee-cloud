name: Kind smoke
run-name: Kind smoke at ${{ github.event.workflow_run.head_sha || inputs.sha }}

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Build main]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of a main commit whose Build main published its images
        type: string
        required: true

permissions:
  contents: read

env:
  OCTOGEE_FLEET_VERSION: v0.2.0
  OCTOGEE_FLEET_COMMIT: c38255767bc5ec7938555a8c8e30a23406bb23f4

jobs:
  build:
    name: Select the Build main run
    if: >-
      github.repository == 'octogee-ai/octogee-cloud' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.run.outputs.sha }}
      run-id: ${{ steps.run.outputs.run-id }}
    steps:
      - name: Select the Build main run that published the commit's images
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$TRIGGER_RUN" ]]; then
            sha="$TRIGGER_SHA" run_id="$TRIGGER_RUN"
          else
            [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA, not $INPUT_SHA"; exit 1; }
            sha="$INPUT_SHA"
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow=build-main.yml --commit="$sha" --event=push \
              --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] || { echo "::error::Build main has no successful push run for $sha"; exit 1; }
          fi
          printf 'sha=%s\nrun-id=%s\n' "$sha" "$run_id" >> "$GITHUB_OUTPUT"
          printf 'Smoke testing commit %s, images from [Build main run %s](%s/%s/actions/runs/%s).\n' \
            "$sha" "$run_id" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"

  kind-smoke:
    name: Kind smoke (amd64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: agent-round-trip
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-manifest-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/build-manifest
          run-id: ${{ needs.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Install octogee-fleet
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/octogee-ai/octogee-fleet@${OCTOGEE_FLEET_COMMIT}"
      - name: Install the published images
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::The agent-round-trip environment has no OPENROUTER_API_KEY secret"
            exit 1
          fi
          OCTOGEE_KIND_STATE="$RUNNER_TEMP/kind-state" \
            scripts/ops/kind-install.sh up --pull --manifest="$RUNNER_TEMP/build-manifest/image-manifest.json"
      - name: List gateways through the Admin API
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/kind-state/octogee"
          kubectl --kubeconfig="$state/kubeconfig" -n octogee-local \
            port-forward --address 127.0.0.1 svc/glm-controller 18080:8080 > "$RUNNER_TEMP/kind-port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/kind-port-forward.log"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused \
            --max-time 3 http://127.0.0.1:18080/healthz > /dev/null
          OCTOGEE_FLEET_CONFIG="$state/fleet-config.json" "$RUNNER_TEMP/bin/octogee-fleet" --env=kind gateway ls --format=json \
            | jq -e 'if .gateways == [] then . else error("expected an empty gateway list") end'
      - name: Get a reply from a user's agent through the LLM broker
        run: |
          node scripts/ops/kind-agent-round-trip.mjs --state="$RUNNER_TEMP/kind-state/octogee" \
            --fleet="$RUNNER_TEMP/bin/octogee-fleet" --model=platform-openrouter/meta/muse-ember
      - name: Show cluster status on failure
        if: failure()
        run: |
          kubeconfig="$RUNNER_TEMP/kind-state/octogee/kubeconfig"
          if [[ -f "$kubeconfig" ]]; then
            kubectl --kubeconfig="$kubeconfig" -n octogee-local get pods,events
            kubectl --kubeconfig="$kubeconfig" -n octogee-local logs deployment/octogee-gateway-shared-a \
              --all-containers --tail=200 || true
          fi
          df -h /

  kind-isolated-smoke:
    name: Kind isolated gateway smoke (amd64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: agent-round-trip
    permissions:
      actions: read
      contents: read
    steps:
      - name: Free runner disk for the isolated gateway image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-manifest-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/build-manifest
          run-id: ${{ needs.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Install octogee-fleet
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/octogee-ai/octogee-fleet@${OCTOGEE_FLEET_COMMIT}"
      - name: Install the published images
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::The agent-round-trip environment has no OPENROUTER_API_KEY secret"
            exit 1
          fi
          OCTOGEE_KIND_STATE="$RUNNER_TEMP/kind-state" \
            scripts/ops/kind-install.sh up --pull --manifest="$RUNNER_TEMP/build-manifest/image-manifest.json"
      - name: Give a user an isolated gateway that runs as a pod, park, resume and retire it
        run: |
          node scripts/ops/kind-isolated-gateway.mjs --state="$RUNNER_TEMP/kind-state/octogee" \
            --fleet="$RUNNER_TEMP/bin/octogee-fleet" --model=platform-openrouter/meta/muse-ember
      - name: Show cluster status on failure
        if: failure()
        run: |
          kubeconfig="$RUNNER_TEMP/kind-state/octogee/kubeconfig"
          if [[ -f "$kubeconfig" ]]; then
            kubectl --kubeconfig="$kubeconfig" -n octogee-local get pods,pvc,events
            for deployment in $(kubectl --kubeconfig="$kubeconfig" -n octogee-local get deployments -o name); do
              if [[ "$deployment" == deployment.apps/octogee-gateway-* ]]; then
                kubectl --kubeconfig="$kubeconfig" -n octogee-local logs "$deployment" --all-containers --tail=200 || true
              fi
            done
            kubectl --kubeconfig="$kubeconfig" -n octogee-local logs deployment/glm-controller --tail=300 || true
          fi
          df -h /
